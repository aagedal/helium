<meta charset="utf-8">
<title>Screenshot permalink regression fixtures</title>
<style>
body { margin: 0; font: 16px system-ui; }
#fixture { position: absolute; inset: 0; }
article, [role=article], [data-testid=status], .detailed-actualStatus { position: absolute; left: 20px; top: 20px; width: 360px; height: 160px; background: #eee; }
.body { position: absolute; left: 15px; top: 55px; width: 300px; height: 80px; background: white; }
header { height: 28px; }
a { display: inline-block; }
</style>
<script src="/source.js"></script>
<div id="fixture"><button onclick="runScreenshotSourceTests()">Run permalink checks</button></div>
<script>
window.runScreenshotSourceTests = () => {
  const fixture = document.getElementById('fixture');
  const results = [];
  const post = (url, extra = '') => `<article><header><a href="${url}"><time>15 October 2026</time></a></header><div id="crop" class="body">Post body without its timestamp ${extra}</div></article>`;
  const crop = id => {
    const r = document.getElementById(id).getBoundingClientRect();
    return {x:r.x, y:r.y, width:r.width, height:r.height, view_width:innerWidth, view_height:innerHeight};
  };
  const check = (name, html, expected, expectedUrl, region = () => crop('crop')) => {
    fixture.innerHTML = html;
    const actual = detectScreenshotSource(region());
    const passed = actual.status === expected &&
        (expectedUrl === undefined || actual.suggested_permalink === expectedUrl);
    results.push({name, passed, expected, expectedUrl, actual});
  };
  check('Twitter cropped body associates timestamp outside crop',
    post('https://twitter.com/reporter/status/12345?s=20'), 'unique', 'https://x.com/reporter/status/12345');
  check('Duplicate X photo links collapse to the original post',
    post('https://x.com/reporter/status/12345', '<a href="https://x.com/reporter/status/12345/photo/1">Photo</a>'),
    'unique', 'https://x.com/reporter/status/12345');
  check('Profile and tracking links are not post permalinks',
    post('https://x.com/reporter', '<a href="https://x.com.attacker.test/reporter/status/123">Bad host</a>'), 'none', '');
  check('Two selected posts remain ambiguous',
    post('https://x.com/reporter/status/12345') + post('https://x.com/other/status/67890').replace('<article>', '<article style="top:195px">').replace('id="crop"', 'id="second"'),
    'ambiguous', '', () => ({x:20,y:20,width:360,height:335,view_width:innerWidth,view_height:innerHeight}));
  check('Two posts with only one discoverable permalink remain ambiguous',
    post('https://x.com/reporter/status/12345') + '<article style="top:195px"><div class="body">A second post with no exposed permalink</div></article>',
    'ambiguous', '', () => ({x:20,y:20,width:360,height:335,view_width:innerWidth,view_height:innerHeight}));
  check('Quoted post does not replace the enclosing post',
    post('https://x.com/reporter/status/12345', '<a href="https://x.com/source/status/67890"><time>Quoted post</time></a>'), 'ambiguous', '');
  const quotePost = `<article id="outer" style="width:400px;height:300px">
    <header><a href="https://x.com/reporter">@reporter</a><a href="https://x.com/reporter/status/123"><time datetime="2026-10-15T22:57:00Z">29m</time></a></header>
    <p dir="auto" id="outer-comment" style="position:absolute;top:25px;left:15px;width:360px;height:45px">An enclosing comment</p>
    <div role="link" data-href="https://x.com/quoted/status/456" style="position:absolute;left:15px;top:100px;width:360px;height:140px">
      <article id="quote" style="position:relative;left:0;top:0;width:360px;height:140px">
        <header><a href="https://x.com/quoted">@quoted</a><a href="https://x.com/quoted/status/456"><time datetime="2026-10-15T14:00:00Z">9h</time></a></header>
        <p dir="auto" id="quote-body" style="position:absolute;left:10px;top:30px;width:330px;height:80px">The original quoted post</p>
      </article>
    </div></article>`;
  const quoteCheck = (name, html, id, expected, url, account, date) => {
    check(name, html, expected, url, () => crop(id));
    const r = results[results.length - 1];
    const primary = r.actual.candidates.find(c => c.url === url);
    if (account) r.passed &&= primary?.site_details.posting_account === account && primary?.site_details.publication_date_text === date;
  };
  quoteCheck('Full quote post prefers enclosing account, permalink and timestamp',
    quotePost, 'outer', 'preferred', 'https://x.com/reporter/status/123', '@reporter', '2026-10-15T22:57:00Z');
  const fullQuoteResult = results[results.length - 1];
  fullQuoteResult.passed &&= fullQuoteResult.actual.selection_reason === 'enclosing_post_in_selection' &&
      fullQuoteResult.actual.candidates.find(c => c.url.endsWith('/456'))?.quoted_by === 'https://x.com/reporter/status/123';
  quoteCheck('Quote-only crop uses the original quoted post',
    quotePost, 'quote', 'preferred', 'https://x.com/quoted/status/456', '@quoted', '2026-10-15T14:00:00Z');
  quoteCheck('Crop confined to quoted text uses the original post',
    quotePost, 'quote-body', 'preferred', 'https://x.com/quoted/status/456', '@quoted', '2026-10-15T14:00:00Z');
  quoteCheck('Outer comment alone retains its own source',
    quotePost, 'outer-comment', 'unique', 'https://x.com/reporter/status/123', '@reporter', '2026-10-15T22:57:00Z');
  quoteCheck('Quote of the same account keeps separate post dates',
    quotePost.replaceAll('x.com/quoted', 'x.com/reporter').replaceAll('@quoted','@reporter'),
    'outer', 'preferred', 'https://x.com/reporter/status/123', '@reporter', '2026-10-15T22:57:00Z');
  quoteCheck('Unlinked enclosing post prevents attribution to its quote',
    quotePost.replace('https://x.com/reporter/status/123', 'https://example.com/unavailable'),
    'outer', 'ambiguous', '');
  quoteCheck('Unlinked outer post does not prevent an isolated quote crop',
    quotePost.replace('https://x.com/reporter/status/123', 'https://example.com/unavailable'),
    'quote', 'unique', 'https://x.com/quoted/status/456', '@quoted', '2026-10-15T14:00:00Z');
  check('Two separate quote posts remain ambiguous',
    quotePost + quotePost.replaceAll('id="outer"','id="second"').replaceAll('id="quote"','id="second-quote"').replaceAll('id="quote-body"','id="second-quote-body"').replace('width:400px;height:300px','width:400px;height:300px;top:340px').replaceAll('status/123','status/789'),
    'ambiguous', '', () => ({x:20,y:20,width:400,height:620,view_width:innerWidth,view_height:innerHeight}));
  quoteCheck('Authenticated quoteTweet container has separate ownership',
    quotePost.replace('<article id="quote"', '<div data-testid="quoteTweet" id="quote"').replace('</article>\n    </div></article>', '</div>\n    </div></article>'),
    'outer', 'preferred', 'https://x.com/reporter/status/123', '@reporter', '2026-10-15T22:57:00Z');
  check('Truth Social post tracking normalization', post('https://www.truthsocial.com/@reporter/posts/123456/?utm_source=share'), 'unique', 'https://truthsocial.com/@reporter/posts/123456');
  check('Truth Social legacy and current paths collapse',
    post('https://truthsocial.com/@reporter/123456', '<a href="https://truthsocial.com/@reporter/posts/123456">Same post</a>'), 'unique', 'https://truthsocial.com/@reporter/posts/123456');
  check('Truth Social profile is not a post', post('https://truthsocial.com/@reporter'), 'none', '');
  check('Truth Social lookalike host is not supported', post('https://truthsocial.com.attacker.test/@reporter/posts/123'), 'none', '');
  const detailsCheck = (name, html, url, expected, region) => {
    check(name, html, 'unique', url, region);
    const result = results[results.length - 1];
    const details = result.actual.candidates.find(c => c.url === url)?.site_details || {};
    result.passed &&= Object.entries(expected).every(([key,value]) => details[key] === value);
    result.expectedDetails = expected;
  };
  const detailedPost = (link, profile, time, extra = '') =>
    `<article><header><a href="${profile}">Reporter</a><a href="${link}">${time}</a></header><div id="crop" class="body">Own post ${extra}</div></article>`;
  detailsCheck('Twitter account and machine timestamp are site-reported',
    detailedPost('https://x.com/reporter/status/123', 'https://x.com/reporter', '<time datetime="2026-10-15T12:34:00Z" title="October 15">2h</time>'),
    'https://x.com/reporter/status/123', {posting_account:'@reporter',publication_date_text:'2026-10-15T12:34:00Z',publication_date_displayed:'2h',publication_datetime_attribute:'2026-10-15T12:34:00Z'});
  detailsCheck('X public timestamp link preserves its relative label',
    '<article><div class="x-middot-group"><a href="https://x.com/reporter">Reporter</a><a href="https://x.com/reporter/status/123" data-base-ui-tooltip-trigger>17h</a></div><div id="crop" class="body">Post</div></article>',
    'https://x.com/reporter/status/123', {posting_account:'@reporter',publication_date_text:'17h',publication_date_displayed:'17h',date_evidence:'post_permalink_timestamp_text'});
  detailsCheck('X timestamp title belongs to its containing permalink',
    detailedPost('https://x.com/reporter/status/123', 'https://x.com/reporter', '<time>9m</time>').replace('<a href="https://x.com/reporter/status/123">', '<a href="https://x.com/reporter/status/123" title="11:57 PM · Oct 15, 2026">'),
    'https://x.com/reporter/status/123', {publication_date_text:'11:57 PM · Oct 15, 2026',publication_date_displayed:'9m'});
  const bskyUrl = 'https://bsky.app/profile/reporter.bsky.social/post/3l6oveex3ii2l';
  const bskyProfile = 'https://bsky.app/profile/reporter.bsky.social';
  const bskyDate = 'October 17, 2024 at 9:06 AM';
  const bskyPost = `<div data-testid="feedItem-by-reporter.bsky.social" role="link" style="position:absolute;left:20px;top:20px;width:400px;height:300px;background:#eee">
    <a href="${bskyProfile}">Reporter</a><a href="${bskyProfile}">@reporter.bsky.social</a>
    <a href="${bskyUrl}?ref_src=share" aria-label="${bskyDate}" data-tooltip="${bskyDate}">· Oct 17, 2024</a>
    <div id="crop" class="body" data-testid="postText" dir="auto">Post text</div></div>`;
  detailsCheck('Bluesky feed crop retains scoped author, display name and accessible date',
    bskyPost, bskyUrl, {posting_account:'@reporter.bsky.social',account_display_name:'Reporter',
      publication_date_text:bskyDate,publication_date_displayed:'· Oct 17, 2024',publication_date_tooltip:bskyDate});
  detailsCheck('Bluesky repost credits original author, not reposter',
    bskyPost.replace('<a href=', '<a href="https://bsky.app/profile/reposter.example">Reposted by Someone</a><a href='),
    bskyUrl, {posting_account:'@reporter.bsky.social'});
  detailsCheck('Bluesky DID profile remains an observed identity without inventing a handle',
    bskyPost.replaceAll('reporter.bsky.social','did:plc:abc123'),
    bskyUrl.replace('reporter.bsky.social','did:plc:abc123'), {posting_account:'did:plc:abc123'});
  detailsCheck('Bluesky missing author link does not infer account from post URL',
    bskyPost.replaceAll(`href="${bskyProfile}"`, 'href="https://example.com"'),
    bskyUrl, {posting_account:undefined,publication_date_text:bskyDate});
  detailsCheck('Bluesky body mention cannot establish posting account',
    bskyPost.replaceAll(`href="${bskyProfile}"`, 'href="https://example.com"').replace('Post text', `<a href="${bskyProfile}">@reporter.bsky.social</a>`),
    bskyUrl, {posting_account:undefined});
  check('Bluesky lookalike domain is rejected', post(bskyUrl.replace('bsky.app/','bsky.app.attacker.test/')), 'none', '');
  check('Bluesky engagement subpage is not normalized into a post', post(bskyUrl+'/liked-by'), 'none', '');
  check('Bluesky profile is not a post', post(bskyProfile), 'none', '');
  check('Bluesky credentials and nonstandard ports are rejected', post(bskyUrl.replace('https://','https://user@')) + post(bskyUrl.replace('bsky.app/','bsky.app:8443/')), 'none', '');
  check('Two Bluesky posts stay ambiguous', bskyPost + bskyPost.replace('top:20px','top:340px').replace('3l6oveex3ii2l','3other').replace('id="crop"','id="second"'),
    'ambiguous','',()=>({x:20,y:20,width:400,height:620,view_width:innerWidth,view_height:innerHeight}));
  const bskyQuote = bskyPost.replace('data-testid="feedItem-by-', 'id="bsky-outer" data-testid="feedItem-by-').replace('Post text', 'Enclosing post').replace('</div></div>', `</div>
    <div id="quote" role="link" aria-label="Post by source.example" style="position:absolute;left:15px;top:160px;width:360px;height:100px;background:white">
      <div data-tooltip="October 16, 2024 at 8:00 AM">1d</div><div id="quote-body" dir="auto">Unlinked quoted text</div>
    </div></div>`);
  check('Bluesky unlinked quote-only crop never adopts enclosing source', bskyQuote, 'ambiguous','',()=>crop('quote'));
  detailsCheck('Bluesky full unlinked quote keeps enclosing date separate', bskyQuote, bskyUrl,
    {publication_date_text:bskyDate,posting_account:'@reporter.bsky.social'},()=>crop('bsky-outer'));
  const linkedBskyQuote = quotePost.replaceAll('https://x.com/reporter/status/123',bskyUrl)
    .replaceAll('https://x.com/reporter',bskyProfile).replaceAll('@reporter','@reporter.bsky.social')
    .replaceAll('https://x.com/quoted/status/456','https://bsky.app/profile/source.example/post/3quoted')
    .replaceAll('https://x.com/quoted','https://bsky.app/profile/source.example');
  quoteCheck('Bluesky linked quotes keep separate author and date', linkedBskyQuote, 'outer', 'preferred',bskyUrl,'@reporter.bsky.social','2026-10-15T22:57:00Z');
  quoteCheck('Bluesky linked quote-only crop prefers quoted source', linkedBskyQuote,'quote','preferred',
    'https://bsky.app/profile/source.example/post/3quoted','@source.example','2026-10-15T14:00:00Z');
  const bskyCanonical = document.createElement('link');
  bskyCanonical.rel = 'canonical'; bskyCanonical.href = bskyUrl;
  document.head.append(bskyCanonical);
  const bskyDetail = `<div data-testid="postThreadItem-by-reporter.bsky.social" style="position:absolute;left:20px;top:20px;width:400px;height:300px">
    <div><a href="${bskyProfile}">Reporter</a></div><div>
      <div id="crop" class="body" style="top:40px" data-word-wrap="1" dir="auto">Body mentions 2026 and 12:00 without being a date</div>
      <div style="position:absolute;top:150px"><div><div dir="auto">9:06 AM · Oct 17, 2024</div><button>Everybody can reply</button></div></div>
      <div style="position:absolute;top:200px"><div data-testid="likeCount-expanded">42 likes</div></div>
    </div></div>`;
  detailsCheck('Bluesky expanded date is scoped to its footer, not body text', bskyDetail, bskyUrl,
    {posting_account:'@reporter.bsky.social',publication_date_text:'9:06 AM · Oct 17, 2024',date_evidence:'bluesky_detail_footer'});
  detailsCheck('Bluesky absent date structure leaves date blank', bskyDetail.replace('data-testid="likeCount-expanded"',''),
    bskyUrl, {publication_date_text:undefined});
  detailsCheck('Bluesky canonical page URL cannot be assigned to a lone reply',
    bskyPost.replace('feedItem-by-', 'postThreadItem-by-').replace('3l6oveex3ii2l','3reply'),
    bskyUrl.replace('3l6oveex3ii2l','3reply'), {publication_date_text:bskyDate});
  bskyCanonical.remove();
  const ttUrl = 'https://www.tiktok.com/@reporter/video/6718335390845095173';
  const ttProfile = 'https://www.tiktok.com/@reporter';
  const ttPost = `<article data-e2e="recommend-list-item-container" style="height:260px">
    <section data-e2e="feed-video"><div><a href="${ttProfile}">Reporter</a><span>· 2019-7-27</span></div>
      <div id="crop" class="body" data-e2e="video-desc">Caption without a linked timestamp</div>
      <button data-e2e="more-menu-icon" data-more-menu-item-id="6718335390845095173" style="position:absolute;top:230px">More</button>
    </section></article>`;
  check('TikTok video path strips tracking and preserves post identity', post(ttUrl+'/?is_from_webapp=1'), 'unique',ttUrl);
  check('TikTok photo path is a distinct observed post', post(ttUrl.replace('/video/','/photo/')+'?photo_id=4'), 'unique',ttUrl.replace('/video/','/photo/'));
  check('TikTok profiles, music and shortened links are not post permalinks',
    post(ttProfile, '<a href="https://www.tiktok.com/music/sound-123">Music</a><a href="https://vm.tiktok.com/ABC/">Short link</a>'), 'none','');
  check('TikTok lookalike hosts are rejected',post(ttUrl.replace('tiktok.com/','tiktok.com.attacker.test/')), 'none','');
  check('TikTok credentials and ports are rejected',post(ttUrl.replace('https://','https://user@'))+post(ttUrl.replace('tiktok.com/','tiktok.com:8443/')), 'none','');
  check('TikTok nonnumeric IDs and extra path components are rejected',post(ttUrl.replace('6718335390845095173','oops'))+post(ttUrl+'/comments'), 'none','');
  const ttCanonical = document.createElement('link');ttCanonical.rel='canonical';ttCanonical.href=ttUrl;document.head.append(ttCanonical);
  detailsCheck('TikTok exact item ID binds page permalink, author and creator date',ttPost,ttUrl,
    {posting_account:'@reporter',account_display_name:'Reporter',publication_date_text:'· 2019-7-27',date_evidence:'tiktok_creator_date_row'});
  detailsCheck('TikTok relative date is preserved without inventing a year or timezone',ttPost.replace('2019-7-27','12h ago'),ttUrl,
    {publication_date_text:'· 12h ago',publication_datetime_attribute:undefined});
  detailsCheck('TikTok incomplete calendar date stays incomplete',ttPost.replace('2019-7-27','10-7'),ttUrl,
    {publication_date_text:'· 10-7'});
  detailsCheck('TikTok tracked profile links still establish creator date ownership',ttPost.replace(ttProfile,ttProfile+'/?lang=en'),ttUrl,
    {posting_account:'@reporter',publication_date_text:'· 2019-7-27'});
  detailsCheck('TikTok caption mentions do not establish an author or publication date',
    ttPost.replace(ttProfile,'https://example.com').replace('Caption without a linked timestamp',`<a href="${ttProfile}">Reporter</a><span>· 2026-10-16</span>`),ttUrl,
    {posting_account:undefined,publication_date_text:undefined});
  detailsCheck('TikTok comment times cannot replace a missing creator date',
    ttPost.replace('<span>· 2019-7-27</span>','').replace('</section>', '<div data-e2e="comment-level-1"><a href="https://www.tiktok.com/@reader">Reader</a><time datetime="2026-10-16T12:00:00Z">1h ago</time></div></section>'),
    ttUrl,{publication_date_text:undefined});
  detailsCheck('TikTok conflicting creator date rows stay unset',ttPost.replace('</section>',`<div><a href="${ttProfile}">Reporter</a><span>· 2026-10-16</span></div></section>`),
    ttUrl,{posting_account:'@reporter',publication_date_text:undefined});
  check('TikTok stale canonical cannot label another video from the same creator',ttPost.replace('data-more-menu-item-id="6718335390845095173"','data-more-menu-item-id="999"'), 'none','');
  check('TikTok missing item ID cannot bind page metadata',ttPost.replace('data-more-menu-item-id="6718335390845095173"',''), 'none','');
  check('TikTok multiple item IDs cannot bind page metadata',ttPost.replace('</section>','<button data-e2e="more-menu-icon" data-more-menu-item-id="999">Other</button></section>'), 'none','');
  check('TikTok unrelated article cannot inherit page URL',post('https://example.com/unlinked'), 'none','');
  detailsCheck('TikTok ID is never decoded into an unobserved date',ttPost.replace('<span>· 2019-7-27</span>',''),ttUrl,
    {publication_date_text:undefined,posting_account:'@reporter'});
  check('TikTok crop confined to an unlinked comment cannot adopt post source',
    ttPost.replace('</section>','<div id="comment-crop" data-e2e="comment-level-1" style="position:absolute;left:20px;top:150px;width:300px;height:40px;background:white"><a href="https://www.tiktok.com/@reader">Reader</a><time datetime="2026-10-16T12:00:00Z">1h ago</time></div></section>'),
    'ambiguous','',()=>crop('comment-crop'));
  const commentPost = ttPost.replace('</section>','<div id="comment-margin" data-e2e="comment-level-1" style="position:absolute;left:20px;top:150px;width:300px;height:40px;background:white">Reader: separate comment</div></section>');
  check('TikTok comment crop with margins cannot inherit enclosing source',commentPost,
    'ambiguous','',()=>{const r=crop('comment-margin');return {...r,x:r.x-5,y:r.y-5,width:r.width+10,height:r.height+10};});
  check('TikTok full post with an unsupported comment requires source review',commentPost,
    'ambiguous','',()=>({x:20,y:20,width:360,height:260,view_width:innerWidth,view_height:innerHeight}));
  detailsCheck('TikTok linked caption timestamp cannot become the post date',
    ttPost.replace('<span>· 2019-7-27</span>','').replace('Caption without a linked timestamp',`<a href="${ttUrl}"><time datetime="2026-10-16T12:00:00Z">Caption reference</time></a>`),
    ttUrl,{publication_date_text:undefined});
  ttCanonical.href=ttUrl.replace('/video/','/photo/');
  detailsCheck('TikTok exact photo item retains its observed photo URL',ttPost,ttCanonical.href,
    {posting_account:'@reporter',publication_date_text:'· 2019-7-27'});
  const observedPhotoUrl = ttCanonical.href + '?image_index=3';
  check('TikTok photo slide URL normalizes only the post link',post(observedPhotoUrl), 'unique',ttCanonical.href);
  results[results.length-1].passed &&= results[results.length-1].actual.candidates[0]?.original_url === observedPhotoUrl;
  ttCanonical.href = 'https://www.tiktok.com/@qq.mm.pp/photo/7479037796326362385';
  detailsCheck('TikTok live photo creator markup keeps its own date and handle',
    ttPost.replaceAll('reporter','qq.mm.pp').replaceAll('6718335390845095173','7479037796326362385').replace('Reporter','ً').replace('2019-7-27','2025-3-7')
      .replace('</section>',`<a href="https://www.tiktok.com/@qq.mm.pp" data-e2e="video-author-avatar"><img alt="qq.mm.pp" width="30" height="30"></a></section>`),
    'https://www.tiktok.com/@qq.mm.pp/photo/7479037796326362385',
    {posting_account:'@qq.mm.pp',publication_date_text:'· 2025-3-7'});
  ttCanonical.href = ttUrl;
  detailsCheck('TikTok hidden creator link cannot establish date despite a visible avatar',
    ttPost.replace(`<a href="${ttProfile}">Reporter</a>`,`<a href="${ttProfile}" hidden>Reporter</a>`)
      .replace('</section>',`<a href="${ttProfile}" data-e2e="video-author-avatar"><span style="display:inline-block;width:30px;height:30px">R</span></a></section>`),
    ttUrl,{posting_account:'@reporter',publication_date_text:undefined});
  detailsCheck('TikTok zero-width name without visible identity leaves attribution blank',
    ttPost.replace('Reporter','ً'),ttUrl,{posting_account:undefined,publication_date_text:undefined});
  const referenceCaption = ttPost.replace('Caption without a linked timestamp',`<a href="${ttUrl.replace('6718335390845095173','999')}">Another post</a>`);
  check('TikTok referenced post cannot replace an unlinked enclosing source',
    referenceCaption.replace('data-more-menu-item-id="6718335390845095173"',''), 'ambiguous','');
  const referenceResult = results[results.length-1];
  referenceResult.passed &&= referenceResult.actual.candidates[0]?.evidence === 'referenced_post_link' &&
    referenceResult.actual.candidates[0]?.site_details.posting_account === undefined;
  check('TikTok own source plus a caption reference remains reviewable',referenceCaption,'ambiguous','');
  const adjacentPosts = ttPost.replace('id="crop"','id="first-crop"') +
    ttPost.replace('height:260px','height:260px;top:300px').replaceAll('6718335390845095173','999').replace('2019-7-27','2026-10-10');
  ttCanonical.href = ttUrl.replace('6718335390845095173','999');
  detailsCheck('TikTok selected item keeps its source with an adjacent visible preload',adjacentPosts,ttCanonical.href,
    {posting_account:'@reporter',publication_date_text:'· 2026-10-10'});
  check('TikTok current page URL cannot label the adjacent item of the same creator',adjacentPosts,
